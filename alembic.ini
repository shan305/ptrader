# Alembic CLI configuration. The application migrates automatically on startup;
# use the CLI for manual inspection or rollbacks, e.g. `alembic current`, `alembic downgrade -1`.
# The database URL comes from PTRADER_DATABASE_URL (see ptrader/config.py) unless set below.
[alembic]
script_location = %(here)s/ptrader/migrations
prepend_sys_path = .
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
